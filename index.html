<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: one question at a time in a centered column; mode switch + progress on top, answer controls at the bottom */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#18211f; --muted:#5d6b67; --line:#d6dedb;
  --accent:#0f6e64; --accent-soft:#e2f1ee; --ok:#1d7a3e; --ok-soft:#e5f4ea; --bad:#b4232f; --bad-soft:#fbe9ea; --warn:#8a5a00; --warn-soft:#fdf3dc;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#19221f; --ink:#e6eeeb; --muted:#94a5a0; --line:#2c3a36;
  --accent:#4fc3b2; --accent-soft:#16332e; --ok:#5fd18a; --ok-soft:#17311f; --bad:#ff7b84; --bad-soft:#3a1a1d; --warn:#f0bf5a; --warn-soft:#352a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#19221f; --ink:#e6eeeb; --muted:#94a5a0; --line:#2c3a36;
  --accent:#4fc3b2; --accent-soft:#16332e; --ok:#5fd18a; --ok-soft:#17311f; --bad:#ff7b84; --bad-soft:#3a1a1d; --warn:#f0bf5a; --warn-soft:#352a12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
header h1{font-size:1.4rem;margin:0;letter-spacing:-.01em}
header .sub{display:block;color:var(--muted);font-size:.85rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 14px;font:inherit;font-size:.88rem;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.top{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;font-variant-numeric:tabular-nums;color:var(--muted);align-items:center}
.meta b{color:var(--ink)} .meta .ok b{color:var(--ok)} .meta .bad b{color:var(--bad)}
.meta .tag{margin-left:auto;font-size:.8rem;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 10px;font-weight:600}
.track{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);width:0}
.card{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.qhead{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;font-family:var(--mono);font-size:.8rem;font-weight:500;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px;margin-top:3px;white-space:nowrap}
.qtext{margin:0;font-weight:500;font-size:1.02rem;white-space:pre-line;min-width:0}
.hint{font-size:.82rem;color:var(--accent);font-weight:600;margin:8px 0 0}
.note{font-size:.8rem;color:var(--muted);margin:6px 0 0}
.fig{margin:14px 0 0;overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px}
.fig img{display:block;max-width:100%;height:auto;margin:0 auto}
.opts{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.opt{width:100%;text-align:left;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;font-family:var(--mono);font-size:.8rem;width:1.7em;height:1.7em;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.opt .t{min-width:0;padding-top:1px}
.mono .opt .t{font-family:var(--mono);font-size:.86rem;word-break:break-word}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .k{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.res{font-weight:600;min-width:0;flex:1 1 auto}
.res.ok{color:var(--ok)} .res.bad{color:var(--bad)}
.primary{border:0;background:var(--accent);color:var(--surface);border-radius:10px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer}
.primary:disabled{opacity:.4;cursor:default}
.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.ghost:hover:not(:disabled){border-color:var(--accent)}
.ghost:disabled{opacity:.4;cursor:default}
.ml{margin-left:auto}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fix{margin-top:12px;font-size:.86rem;background:var(--warn-soft);border-radius:8px;padding:9px 11px}
.fix b{color:var(--warn)}
.warnbox{margin-top:12px;background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:.9rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.warnbox span{flex:1 1 200px}
.grid{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.grid button{font-family:var(--mono);font-size:.8rem;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:6px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.grid button.ans{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
.grid button.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-soft)}
.grid button.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-soft)}
.grid button.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink)}
.gridlab{margin-top:18px;font-size:.8rem;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.end{text-align:center}
.end .score{font-family:var(--mono);font-size:2.6rem;font-weight:500;margin:4px 0;font-variant-numeric:tabular-nums}
.end p{margin:4px 0;color:var(--muted)}
.wlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 4px}
.wlist span{font-family:var(--mono);font-size:.8rem;background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:2px 8px}
.end .tools{justify-content:center}
.keys{font-size:.78rem;color:var(--muted);margin-top:10px}
@media (prefers-reduced-motion:no-preference){.track i{transition:width .25s}.opt{transition:border-color .15s,background .15s}}
</style>

<script>

const KEY = 'netquiz-v4';
const byN = Object.fromEntries(QS.map(q => [q.n, q]));
const ALL = QS.map(q => q.n);

function shuffled(arr){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newPerm(q){ return shuffled(q.o.map((_, i) => i + 1)); }
function isCorrect(q, perm, sel){
  const chosen = sel.map(p => perm[p - 1]).sort((a, b) => a - b);
  const ans = q.a.slice().sort((a, b) => a - b);
  return chosen.length === ans.length && chosen.every((v, i) => v === ans[i]);
}

/* practice: {order, idx, results:{n:bool}, retry, perm, sel, graded}
   exam:     {order, idx, perms:{n:perm}, ans:{n:[pos]}, submitted, warn} */
function freshPractice(order, retry){ return {order, idx:0, results:{}, retry:!!retry, perm:null, sel:[], graded:false}; }
function freshExam(order){ return {order, idx:0, perms:{}, ans:{}, submitted:false, warn:false}; }

let st = null;
// 열 때마다 새로 시작: 예전 버전이 저장해 둔 진행 기록은 지운다
try { ['netquiz-v1','netquiz-v2','netquiz-v3','netquiz-v4'].forEach(k => localStorage.removeItem(k)); } catch (e) {}
const valid = o => o && Array.isArray(o.order) && o.order.length && o.order.every(n => byN[n]);
if (!st || !valid(st.practice) || !valid(st.exam)) st = {cur:'practice', practice:freshPractice(shuffled(ALL)), exam:freshExam(shuffled(ALL))};
function save(){}

const stage = document.getElementById('stage'), meta = document.getElementById('meta'), bar = document.getElementById('bar'), tools = document.getElementById('tools'), keys = document.getElementById('keys');

function card(q, perm, sel, opts, label){
  // opts: {locked, showAnswer}
  const multi = q.a.length > 1;
  const el = document.createElement('article');
  el.className = 'card' + (q.mono ? ' mono' : '');
  el.innerHTML = `
    <div class="qhead"><span class="num">문제 ${label}</span><p class="qtext"></p></div>
    ${multi ? `<p class="hint">정답 ${q.a.length}개를 모두 고르세요</p>` : ''}
    ${q.note ? `<p class="note">${q.note}</p>` : ''}
    ${q.img ? `<div class="fig"><img alt="문제 ${label} 그림" src="${IMG[q.img]}"></div>` : ''}
    <ul class="opts"></ul>
    <div class="foot"></div>`;
  el.querySelector('.qtext').textContent = q.q;
  const ul = el.querySelector('.opts');
  perm.forEach((orig, i) => {
    const pos = i + 1;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt';
    b.innerHTML = `<span class="k">${pos}</span><span class="t"></span>`;
    b.querySelector('.t').textContent = q.o[orig - 1];
    const picked = sel.includes(pos);
    b.setAttribute('aria-pressed', picked && !opts.showAnswer ? 'true' : 'false');
    if (opts.showAnswer){
      if (q.a.includes(orig)) b.classList.add('right'); else if (picked) b.classList.add('wrong');
    }
    if (opts.locked) b.disabled = true; else b.addEventListener('click', () => pick(pos));
    const li = document.createElement('li'); li.appendChild(b); ul.appendChild(li);
  });
  if (opts.showAnswer){
    const ok = isCorrect(q, perm, sel);
    const ansPos = perm.map((orig, i) => q.a.includes(orig) ? i + 1 : null).filter(Boolean);
    const res = document.createElement('span');
    res.className = 'res ' + (ok ? 'ok' : 'bad');
    res.textContent = ok ? '정답입니다' : (sel.length ? `오답 · 정답은 ${ansPos.join(', ')}번` : `안 푼 문제 · 정답은 ${ansPos.join(', ')}번`);
    el.querySelector('.foot').appendChild(res);
    if (q.fix){ const f = document.createElement('div'); f.className = 'fix'; f.innerHTML = '<b>정답 수정 · </b>'; f.append(q.fix); el.appendChild(f); }
  }
  return el;
}

function btn(cls, text, fn, disabled){
  const b = document.createElement('button'); b.type = 'button'; b.className = cls; b.textContent = text;
  if (disabled) b.disabled = true; else b.addEventListener('click', fn);
  return b;
}

/* ---------------- practice mode ---------------- */
function renderPractice(){
  const s = st.practice, total = s.order.length;
  const ok = Object.values(s.results).filter(Boolean).length, bad = Object.values(s.results).filter(v => v === false).length;
  const pos = Math.min(s.idx + 1, total);
  meta.innerHTML = `<span><b>${pos}</b> / ${total}</span><span class="ok">정답 <b>${ok}</b></span><span class="bad">오답 <b>${bad}</b></span><span class="tag">${s.retry ? '틀린 문제 다시 풀기' : '한 문제씩 채점'}</span>`;
  bar.style.width = (Object.keys(s.results).length / total * 100) + '%';
  tools.replaceChildren(
    btn('ghost', '처음부터 (원본 문제 순서)', () => { st.practice = freshPractice(ALL); save(); render(); window.scrollTo({top:0}); }),
    btn('ghost', '처음부터 (문제·보기 다시 섞기)', () => { st.practice = freshPractice(shuffled(ALL)); save(); render(); window.scrollTo({top:0}); })
  );
  keys.textContent = '키보드: 숫자 키로 보기 선택 · Enter로 채점 / 다음 문제';

  if (s.idx >= total){
    const wrong = s.order.filter(n => s.results[n] === false);
    const wrongPos = s.order.map((n, i) => s.results[n] === false ? i + 1 : null).filter(Boolean);
    stage.replaceChildren(endCard(s.retry ? '틀린 문제 다시 풀기 결과' : '연습 결과', ok, total, wrong, wrongPos));
    return;
  }
  const q = byN[s.order[s.idx]];
  if (!s.perm || s.perm.length !== q.o.length){ s.perm = newPerm(q); s.sel = []; s.graded = false; save(); }
  const el = card(q, s.perm, s.sel, {locked:s.graded, showAnswer:s.graded}, s.idx + 1);
  const foot = el.querySelector('.foot');
  const go = s.graded
    ? btn('primary ml', s.idx + 1 < total ? '다음 문제' : '결과 보기', practiceNext)
    : btn('primary ml', '채점', practiceGrade, s.sel.length === 0);
  go.id = 'go'; foot.appendChild(go);
  stage.replaceChildren(el);
  go.focus({preventScroll:true});
}
function practiceGrade(){
  const s = st.practice; if (s.graded || !s.sel.length) return;
  const q = byN[s.order[s.idx]];
  s.results[q.n] = isCorrect(q, s.perm, s.sel); s.graded = true; save(); render();
}
function practiceNext(){
  const s = st.practice; s.idx++; s.perm = null; s.sel = []; s.graded = false; save(); render(); window.scrollTo({top:0});
}

/* ---------------- exam mode ---------------- */
function renderExam(){
  const s = st.exam, total = s.order.length;
  const answered = s.order.filter(n => (s.ans[n] || []).length).length;
  const q = byN[s.order[s.idx]];
  if (!s.perms[q.n]){ s.perms[q.n] = newPerm(q); save(); }
  const perm = s.perms[q.n], sel = s.ans[q.n] || [];

  if (s.submitted){
    const r = examScore();
    meta.innerHTML = `<span>점수 <b>${r.score}</b> / ${r.answered}</span><span class="ok">정답 <b>${r.score}</b></span><span class="bad">오답 <b>${r.wrong.length}</b></span>${r.skipped ? `<span>안 푼 문제 <b>${r.skipped}</b></span>` : ''}<span class="tag">시험 채점 완료 · 문제 ${s.idx + 1} 확인 중</span>`;
    bar.style.width = '100%';
  } else {
    meta.innerHTML = `<span><b>${s.idx + 1}</b> / ${total}</span><span>답한 문제 <b>${answered}</b></span><span>남은 문제 <b>${total - answered}</b></span><span class="tag">끝까지 풀고 한 번에 채점</span>`;
    bar.style.width = (answered / total * 100) + '%';
  }

  const nodes = [];
  if (s.submitted && s.idx === -1){ /* not used */ }
  const el = card(q, perm, sel, {locked:s.submitted, showAnswer:s.submitted}, s.idx + 1);
  const foot = el.querySelector('.foot');
  const prev = btn('ghost', '이전', () => examGo(s.idx - 1), s.idx === 0);
  foot.appendChild(prev);
  if (s.idx + 1 < total){
    const nx = btn('primary ml', '다음 문제', () => examGo(s.idx + 1)); nx.id = 'go'; foot.appendChild(nx);
  } else if (!s.submitted){
    const sub = btn('primary ml', '제출하고 채점하기', examSubmit); sub.id = 'go'; foot.appendChild(sub);
  } else {
    const fin = btn('primary ml', '결과 보기', () => { s.idx = total; save(); render(); }); fin.id = 'go'; foot.appendChild(fin);
  }
  nodes.push(el);

  if (s.warn && !s.submitted){
    const w = document.createElement('div'); w.className = 'warnbox';
    const t = document.createElement('span'); t.textContent = `아직 안 푼 문제가 ${total - answered}개 있습니다. 지금 종료하면 푼 ${answered}문제만 채점하고, 안 푼 문제는 채점에서 빠집니다.`;
    w.append(t, btn('ghost', '계속 풀기', () => { s.warn = false; save(); render(); }), btn('primary', '지금 종료하고 채점', () => examSubmit(true)));
    el.appendChild(w);
  }

  const lab = document.createElement('p'); lab.className = 'gridlab';
  lab.textContent = s.submitted ? '문제 번호를 눌러 정답을 확인하세요 (초록 정답 · 빨강 오답 · 색 없음 안 푼 문제)' : '문제 번호를 눌러 바로 이동 (색칠된 번호는 답한 문제)';
  const grid = document.createElement('div'); grid.className = 'grid';
  s.order.forEach((n, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = i + 1;
    b.setAttribute('aria-label', `문제 ${i + 1}`);
    if (s.submitted){ if ((s.ans[n] || []).length) b.classList.add(isCorrect(byN[n], s.perms[n], s.ans[n]) ? 'ok' : 'bad'); }
    else if ((s.ans[n] || []).length) b.classList.add('ans');
    if (i === s.idx) b.classList.add('cur');
    b.addEventListener('click', () => examGo(i));
    grid.appendChild(b);
  });
  nodes.push(lab, grid);

  tools.replaceChildren(
    ...(s.submitted ? [] : [btn('primary', '지금 종료하고 채점', () => examSubmit())]),
    btn('ghost', s.submitted ? '새 시험 시작 (문제·보기 다시 섞기)' : '시험 처음부터 다시 (문제·보기 다시 섞기)', () => { st.exam = freshExam(shuffled(ALL)); save(); render(); window.scrollTo({top:0}); })
  );
  keys.textContent = s.submitted ? '키보드: ← → 로 문제 이동' : '키보드: 숫자 키로 보기 선택 · ← → 또는 Enter로 문제 이동';
  stage.replaceChildren(...nodes);
}
function renderExamEnd(){
  const s = st.exam, total = s.order.length;
  const r = examScore();
  meta.innerHTML = `<span>점수 <b>${r.score}</b> / ${r.answered}</span><span class="ok">정답 <b>${r.score}</b></span><span class="bad">오답 <b>${r.wrong.length}</b></span>${r.skipped ? `<span>안 푼 문제 <b>${r.skipped}</b></span>` : ''}<span class="tag">시험 채점 완료</span>`;
  bar.style.width = '100%';
  const end = endCard(r.skipped ? '시험 결과 (중간 종료)' : '시험 결과', r.score, r.answered, r.wrong, r.wrongPos,
    r.skipped ? (r.answered ? `전체 ${total}문제 중 ${r.answered}문제를 풀고 종료했습니다. 안 푼 ${r.skipped}문제는 채점에서 뺐습니다.` : `푼 문제 없이 종료했습니다.`) : '');
  end.querySelector('.tools').prepend(btn('ghost', '문제별 정답 확인', () => { s.idx = 0; save(); render(); window.scrollTo({top:0}); }));
  stage.replaceChildren(end);
  tools.replaceChildren(btn('ghost', '새 시험 시작 (문제·보기 다시 섞기)', () => { st.exam = freshExam(shuffled(ALL)); save(); render(); window.scrollTo({top:0}); }));
  keys.textContent = '';
}
function examGo(i){
  const s = st.exam; if (i < 0 || i >= s.order.length) return;
  s.idx = i; save(); render(); window.scrollTo({top:0});
}
function examSubmit(force){
  const s = st.exam;
  const answered = s.order.filter(n => (s.ans[n] || []).length).length;
  if (answered < s.order.length && force !== true){ s.warn = true; save(); render(); document.querySelector('.warnbox')?.scrollIntoView({block:'center'}); return; }
  s.order.forEach(n => { if (!s.perms[n]) s.perms[n] = newPerm(byN[n]); });
  s.submitted = true; s.warn = false; s.idx = s.order.length; save(); render(); window.scrollTo({top:0});
}

/* ---------------- shared ---------------- */
function examScore(){
  const s = st.exam;
  const done = s.order.filter(n => (s.ans[n] || []).length);
  const wrong = done.filter(n => !isCorrect(byN[n], s.perms[n], s.ans[n]));
  return {answered: done.length, score: done.length - wrong.length, wrong, skipped: s.order.length - done.length,
          wrongPos: s.order.map((n, i) => wrong.includes(n) ? i + 1 : null).filter(Boolean)};
}
function endCard(title, ok, total, wrong, wrongPos, note){
  const sec = document.createElement('section'); sec.className = 'card end';
  sec.innerHTML = `
    <p>${title}</p>
    <div class="score">${ok} / ${total}</div>
    ${note ? `<p>${note}</p>` : ''}
    <p>${wrong.length ? `틀린 문제 ${wrong.length}개` : (total ? '푼 문제는 모두 맞혔습니다' : '')}</p>
    ${wrong.length ? `<div class="wlist">${wrongPos.map(n => `<span>${n}번</span>`).join('')}</div>` : ''}
    <div class="tools"></div>`;
  if (wrong.length){
    const r = btn('primary', '틀린 문제만 연습 모드로 다시 풀기', () => { st.practice = freshPractice(shuffled(wrong), true); st.cur = 'practice'; save(); render(); window.scrollTo({top:0}); });
    sec.querySelector('.tools').appendChild(r);
  }
  return sec;
}
function pick(pos){
  if (st.cur === 'practice'){
    const s = st.practice; if (s.graded) return;
    const q = byN[s.order[s.idx]];
    s.sel = q.a.length > 1 ? (s.sel.includes(pos) ? s.sel.filter(x => x !== pos) : [...s.sel, pos]) : [pos];
  } else {
    const s = st.exam; if (s.submitted) return;
    const q = byN[s.order[s.idx]]; const cur = s.ans[q.n] || [];
    s.ans[q.n] = q.a.length > 1 ? (cur.includes(pos) ? cur.filter(x => x !== pos) : [...cur, pos]) : [pos];
  }
  save(); render();
}
function render(){
  document.getElementById('mPractice').setAttribute('aria-pressed', st.cur === 'practice' ? 'true' : 'false');
  document.getElementById('mExam').setAttribute('aria-pressed', st.cur === 'exam' ? 'true' : 'false');
  if (st.cur === 'practice') renderPractice();
  else if (st.exam.idx >= st.exam.order.length) renderExamEnd();
  else renderExam();
}
document.getElementById('mPractice').onclick = () => { st.cur = 'practice'; save(); render(); };
document.getElementById('mExam').onclick = () => { st.cur = 'exam'; save(); render(); };

document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const a = document.activeElement;
  const onOtherButton = a && a.tagName === 'BUTTON' && !a.classList.contains('opt');
  if (st.cur === 'practice'){
    const s = st.practice; if (s.idx >= s.order.length) return;
    const q = byN[s.order[s.idx]];
    if (/^[1-9]$/.test(e.key) && +e.key <= q.o.length && !s.graded){ e.preventDefault(); pick(+e.key); }
    else if (e.key === 'Enter' && !onOtherButton){ e.preventDefault(); s.graded ? practiceNext() : practiceGrade(); }
  } else {
    const s = st.exam; if (s.idx >= s.order.length) return;
    const q = byN[s.order[s.idx]];
    if (/^[1-9]$/.test(e.key) && +e.key <= q.o.length && !s.submitted){ e.preventDefault(); pick(+e.key); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); examGo(s.idx + 1); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); examGo(s.idx - 1); }
    else if (e.key === 'Enter' && !onOtherButton){ e.preventDefault(); if (s.idx + 1 < s.order.length) examGo(s.idx + 1); else if (!s.submitted) examSubmit(); }
  }
});

render();
</script>

</body></html>
